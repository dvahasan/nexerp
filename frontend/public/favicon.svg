<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#1d4ed8"/>
  <!-- Box body -->
  <polygon points="32,10 54,22 54,44 32,56 10,44 10,22" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <!-- Box middle lines -->
  <line x1="32" y1="10" x2="32" y2="56" stroke="#fff" stroke-width="2.5" stroke-dasharray="0"/>
  <line x1="10" y1="22" x2="54" y2="22" stroke="#fff" stroke-width="2.5"/>
  <!-- Highlight top face -->
  <polygon points="32,10 54,22 32,34 10,22" fill="rgba(255,255,255,0.18)" stroke="none"/>
  <!-- Tape line across lid -->
  <line x1="32" y1="10" x2="32" y2="34" stroke="#93c5fd" stroke-width="3"/>
  <line x1="21" y1="16" x2="43" y2="16" stroke="#93c5fd" stroke-width="2"/>
</svg>
